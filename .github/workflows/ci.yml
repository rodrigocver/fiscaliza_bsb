name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fiscaliza
          POSTGRES_PASSWORD: fiscaliza
          POSTGRES_DB: fiscaliza_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiscaliza"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integracao
        env:
          DATABASE_URL_TESTE: postgres://fiscaliza:fiscaliza@localhost:5432/fiscaliza_teste
      # Cenário conhecido no banco de teste, antes do build: as páginas estáticas (início, índice da busca,
      # sitemap) são geradas no build a partir dele, e os testes de ponta a ponta contam com esses dados.
      - run: npm run e2e:preparar
        env:
          DATABASE_URL_TESTE: postgres://fiscaliza:fiscaliza@localhost:5432/fiscaliza_teste
      - run: npm run build
        env:
          DATABASE_URL: postgres://fiscaliza:fiscaliza@localhost:5432/fiscaliza_teste
          AUTH_SECRET: ci
      - run: npm run conferir:cache
      - run: npx playwright install --with-deps chromium
      # Abre as páginas no navegador (celular), roda o axe em cada uma e testa busca, redirecionamentos, CSV e o
      # fluxo de quem está logado.
      - run: npx playwright test
        env:
          DATABASE_URL_TESTE: postgres://fiscaliza:fiscaliza@localhost:5432/fiscaliza_teste
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright
          path: test-results/
          retention-days: 7

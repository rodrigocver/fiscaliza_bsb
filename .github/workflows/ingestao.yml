name: Ingestão de dados

on:
  schedule:
    # Diária às 06:17 de Brasília — depois que a Câmara regenera os arquivos (madrugada).
    - cron: "17 9 * * *"
    # Domingo: recarrega a legislatura inteira (situação de projetos antigos muda).
    - cron: "47 10 * * 0"
  workflow_dispatch:
    inputs:
      desde:
        description: "Ano inicial (vazio = só o ano corrente)"
        required: false

concurrency: ingestao

jobs:
  # Antes da publicação (DEPLOY.md), não há banco: pula com um aviso em vez de falhar todo dia.
  configurado:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::Banco ainda não configurado (DEPLOY.md, passo 2). Nada a fazer."; fi

  ingerir:
    needs: configurado
    if: needs.configurado.outputs.ok == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Para abrir e fechar as issues de alerta (último passo).
    permissions:
      contents: read
      issues: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - run: echo "INICIO=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Ingerir
        id: ingerir
        run: |
          if [ -n "${{ inputs.desde }}" ]; then
            npm run ingest -- --desde "${{ inputs.desde }}"
          elif [ "${{ github.event.schedule }}" = "47 10 * * 0" ]; then
            npm run ingest -- --desde 2023
          else
            npm run ingest
          fi
      # As páginas públicas ficam em cache na CDN; avisa o site para renová-las com os dados novos.
      # Roda mesmo se alguma tarefa falhou (as demais trouxeram dados novos). Sem APP_URL/segredo, pula.
      - name: Renovar cache do site
        if: always()
        env:
          APP_URL: ${{ vars.APP_URL }}
          REVALIDAR_SEGREDO: ${{ secrets.REVALIDAR_SEGREDO }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$REVALIDAR_SEGREDO" ]; then echo "APP_URL ou REVALIDAR_SEGREDO não configurados; pulando."; exit 0; fi
          curl -fsS -X POST -H "Authorization: Bearer $REVALIDAR_SEGREDO" "$APP_URL/api/revalidar"
      # Uma issue "Ingestão falhou: <tarefa>" por tarefa com erro; comenta se já existe e fecha quando volta a passar.
      # Não roda quando a execução é cancelada à mão.
      - name: Avisar falhas
        if: ${{ !cancelled() }}
        env:
          RESULTADO_INGERIR: ${{ steps.ingerir.outcome }}
          GITHUB_TOKEN: ${{ github.token }}
          EXECUCAO_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npx tsx scripts/alertar-ingestao.ts

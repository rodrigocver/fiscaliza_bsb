name: Resumo mensal

on:
  schedule:
    # Dia 1º às 10:07 de Brasília, depois da ingestão diária.
    - cron: "7 13 1 * *"
  workflow_dispatch:
    inputs:
      mes:
        description: "Mês no formato AAAA-MM (vazio = mês anterior)"
        required: false

concurrency: resumo-mensal

jobs:
  # Sem banco ou sem serviço de e-mail (DEPLOY.md, passos 2 e 4), não há o que enviar: pula com um aviso.
  configurado:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.c.outputs.ok }}
    steps:
      - id: c
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_RESEND_KEY: ${{ secrets.AUTH_RESEND_KEY }}
        run: |
          if [ -n "$DATABASE_URL" ] && [ -n "$AUTH_RESEND_KEY" ]; then echo "ok=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::Banco ou e-mail (Resend) ainda não configurados (DEPLOY.md). Nada a enviar."; fi

  enviar:
    needs: configurado
    if: needs.configurado.outputs.ok == '1'
    runs-on: ubuntu-latest
    # Partes em paralelo: cada usuário cai sempre na mesma parte (--parte k/n). Com milhões de usuários, o tempo
    # é limitado pela taxa de envio do Resend; aumente as partes junto com o limite da conta.
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    timeout-minutes: 360
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_RESEND_KEY: ${{ secrets.AUTH_RESEND_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enviar
        run: |
          MES="${{ inputs.mes }}"
          npm run resumo-mensal -- --parte "${{ matrix.parte }}/4" ${MES:+--mes "$MES"}
